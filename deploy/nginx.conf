# Static server for the production image (Dockerfile). Serves the Astro build in `dist/`.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  absolute_redirect off;
  server_tokens off;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

  # Same headers astro.config.mjs sets for the dev server.
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  error_page 404 /404.html;
  error_page 410 /404.html;

  # The old WordPress install was compromised and indexed with gambling spam. Its URLs are gone
  # for good: 410 tells search engines to drop them faster than a 404.
  location ~* (\.php$|^/(wp-admin|wp-content|wp-includes|wp-json|blog|contactanos|educa|new|nuevo|feed|comments|courses|courses-1|cursos|course-category|lp-courses)(/|$)) {
    return 410;
  }

  location / {
    # `build.format: 'directory'` emits `/route/index.html`.
    try_files $uri $uri/index.html $uri.html =404;
  }

  location /materiales/ {
    add_header Cache-Control "public, max-age=604800";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }
}
